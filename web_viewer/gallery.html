<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Gallery</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      font-family: monospace;
      min-height: 100vh;
      padding: 16px;
    }

    h1 {
      color: #e5e5e5;
      font-size: 13px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 4px;
      padding-left: 4px;
    }

    #sub {
      color: #555;
      font-size: 11px;
      font-family: monospace;
      padding-left: 4px;
      margin-bottom: 20px;
    }

    .grid {
      columns: 5 220px;
      column-gap: 8px;
    }

    .card {
      break-inside: avoid;
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
      border-radius: 4px;
      cursor: zoom-in;
      background: #111;
    }

    .card:nth-child(3n+1) { transform: rotate(-0.4deg); }
    .card:nth-child(3n+2) { transform: rotate(0.6deg); }
    .card:nth-child(3n)   { transform: rotate(-0.2deg); }

    .card:hover {
      transform: rotate(0deg) scale(1.02) !important;
      z-index: 10;
      box-shadow: 0 8px 32px rgba(0,0,0,0.8);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .card img {
      width: 100%;
      height: auto;
      display: block;
      filter: brightness(0.92);
      transition: filter 0.15s ease;
    }

    .card:hover img {
      filter: brightness(1.05);
    }

    .card .label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 20px 8px 6px;
      background: linear-gradient(transparent, rgba(0,0,0,0.75));
      color: rgba(255,255,255,0.6);
      font-size: 9px;
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.15s ease;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card:hover .label {
      opacity: 1;
    }

    /* lightbox */
    #lb {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 100;
      align-items: center;
      justify-content: center;
      cursor: zoom-out;
    }

    #lb.open { display: flex; }

    #lb img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 24px 80px rgba(0,0,0,0.9);
    }

    #lb-name {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 11px;
      font-family: monospace;
      letter-spacing: 0.1em;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <h1>Phase 2 &mdash; Echte Aufnahmen</h1>
  <p id="sub">Nach synthetisch generierten Testdaten: reale Bilder aus produktiver Umgebung</p>

  <div class="grid" id="grid"></div>

  <div id="lb">
    <img id="lb-img" src="" alt="">
    <div id="lb-name"></div>
  </div>

  <script>
    const images = [
      "../data/testing/images/display_spi.png",
      "../data/testing/images/erklaerung-stromzaehler.png",
      "../data/testing/images/image copy 10.png",
      "../data/testing/images/image copy 11.png",
      "../data/testing/images/image copy 13.png",
      "../data/testing/images/image copy 14.png",
      "../data/testing/images/image copy 15.png",
      "../data/testing/images/image copy 17.png",
      "../data/testing/images/image copy 18.png",
      "../data/testing/images/image copy 19.png",
      "../data/testing/images/image copy 2.png",
      "../data/testing/images/image copy 20.png",
      "../data/testing/images/image copy 23.png",
      "../data/testing/images/image copy 24.png",
      "../data/testing/images/image copy 25.png",
      "../data/testing/images/image copy 26.png",
      "../data/testing/images/image copy 27.png",
      "../data/testing/images/image copy 3.png",
      "../data/testing/images/image copy 4.png",
      "../data/testing/images/image copy 5.png",
      "../data/testing/images/image copy 6.png",
      "../data/testing/images/image copy 7.png",
      "../data/testing/images/image copy 8.png",
      "../data/testing/images/image copy 9.png",
      "../data/testing/images/image copy.png",
      "../data/testing/images/image.png",
      "../data/testing/images/pic1.png",
      "../data/testing/images/pic2.png",
    ];

    const grid = document.getElementById('grid');
    const lb   = document.getElementById('lb');
    const lbImg  = document.getElementById('lb-img');
    const lbName = document.getElementById('lb-name');

    images.forEach(src => {
      const card = document.createElement('div');
      card.className = 'card';

      const img = document.createElement('img');
      img.src = src;
      img.loading = 'lazy';
      img.alt = src.split('/').pop();

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = src.split('/').pop();

      card.append(img, label);
      card.addEventListener('click', () => {
        lbImg.src = src;
        lbName.textContent = src.split('/').pop();
        lb.classList.add('open');
      });

      grid.appendChild(card);
    });

    lb.addEventListener('click', () => lb.classList.remove('open'));
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') lb.classList.remove('open');
    });
  </script>
</body>
</html>
